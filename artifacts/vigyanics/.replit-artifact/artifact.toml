kind = "web"
previewPath = "/"
title = "Vigyanics"
version = "1.0.0"
id = "artifacts/vigyanics"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19502

[services.development]
run = "pnpm --filter @workspace/vigyanics run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vigyanics", "run", "build" ]
publicDir = "artifacts/vigyanics/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19502"
BASE_PATH = "/"
